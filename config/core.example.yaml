# Config de ejemplo del core. Copiar a config/core.yaml y ajustar.
# El endpoint y las credenciales van por variable de entorno (.env), NO aqui.
# Ver ADR 0013 (backend) y ADR 0014 (esquema de configuracion).

models:
  - id: local_llama
    provider: ollama
    adapter: openai_compatible
    endpoint: ${OPENAI_COMPAT_BASE_URL}
    model_name: llama3.1:8b
    capabilities: [chat]
    profile: default

domains:
  - id: general
    description: "Dominio general por defecto"
    preferred_model: local_llama
    fallback_models: []
    profile: default
    status: active

profiles:
  - id: default
    temperature: 0.2
    max_tokens: 512
    top_p: 1.0
    max_iterations: 4
    max_time_s: 60
    max_context_tokens: 4096

# Con un solo modelo el router clasifica los dominios contra ese mismo modelo.
router: { model: local_llama, profile: default }
default_domain: general

# La plantilla lab muestra el reparto multi-modelo.
orchestration:
  planner: { model: local_llama, profile: default }
  combiner: { model: local_llama, profile: default }
  max_subtasks: 6
  max_iterations: 2
  max_replans: 1
  max_time_s: 120
  max_parallel: 2
  token_budget: { base: 2000, per_subtask: 3000 }
  default_effort: medium
  effort:
    low:
      max_subtasks: 3
      max_iterations: 1
      max_replans: 0
      max_time_s: 30
      coverage: { max_chunks: 4, max_retries_per_unit: 1 }
    high:
      max_subtasks: 12
      max_iterations: 4
      max_replans: 2
      max_time_s: 480
      coverage: { max_chunks: 16, max_retries_per_unit: 3 }
  coverage:
    validator: { model: local_llama, profile: default }
    units_per_chunk: 3
    max_chunks: 8
    max_retries_per_unit: 2
    max_no_progress_iterations: 2

identity_defaults:
  user_id: local
  service: local_cli

telemetry:
  csv_path: local/telemetry/core.csv
  jsonl_path: local/telemetry/core.jsonl
  rotation: size
  strict_mode: false
