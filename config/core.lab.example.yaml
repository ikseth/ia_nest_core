# Config de laboratorio de ejemplo: roster multi-modelo con enrutado por dominio.
# Copiar a config/core.yaml. Endpoint y credenciales por env var (.env), NO aqui.
#
# Criterio de modelos: los dominios sensibles a sesgo (general, humanidades)
# usan modelos occidentales, incluso en el fallback; los dominios tecnicos
# pueden usar otros. Ver docs/DESPLIEGUE.md.

models:
  - id: mistral_nemo
    provider: ollama
    adapter: openai_compatible
    endpoint: ${OPENAI_COMPAT_BASE_URL}
    model_name: mistral-nemo:latest
    capabilities: [chat]
    profile: default
  - id: mistral_7b
    provider: ollama
    adapter: openai_compatible
    endpoint: ${OPENAI_COMPAT_BASE_URL}
    model_name: mistral:7b
    capabilities: [chat]
    profile: default
  - id: qwen_tech
    provider: ollama
    adapter: openai_compatible
    endpoint: ${OPENAI_COMPAT_BASE_URL}
    model_name: qwen2.5:7b
    capabilities: [chat]
    profile: default
  - id: deepseek_reason
    provider: ollama
    adapter: openai_compatible
    endpoint: ${OPENAI_COMPAT_BASE_URL}
    model_name: deepseek-r1:8b
    capabilities: [chat]
    profile: default

domains:
  - id: general
    description: "Consultas generales que no encajan claramente en otro dominio configurado."
    preferred_model: mistral_nemo
    fallback_models: [mistral_7b]
    profile: default
    status: active
  - id: humanidades
    description: "Filosofia, etica, historia, politica, religion, literatura y analisis cultural."
    preferred_model: mistral_nemo
    fallback_models: [mistral_7b]
    profile: default
    status: active
  - id: matematicas
    description: "Calculo numerico y simbolico, algebra, geometria, estadistica y demostraciones matematicas."
    preferred_model: qwen_tech
    fallback_models: [deepseek_reason]
    profile: default
    status: active
  - id: codigo
    description: "Diseno, escritura, revision, depuracion y explicacion de codigo fuente y software."
    preferred_model: qwen_tech
    fallback_models: [deepseek_reason]
    profile: default
    status: active
  - id: linux
    description: "Administracion y diagnostico de Linux, shell, servicios, permisos, redes y sistemas."
    preferred_model: qwen_tech
    fallback_models: [deepseek_reason]
    profile: default
    status: active
  - id: razonamiento
    description: "Deduccion logica, problemas abstractos, planificacion y razonamiento paso a paso."
    preferred_model: deepseek_reason
    fallback_models: [qwen_tech]
    profile: default
    status: active

profiles:
  - id: default
    temperature: 0.2
    max_tokens: 512
    top_p: 1.0
    max_iterations: 4
    max_time_s: 60
    max_context_tokens: 4096
    system: "Responde siempre en espanol, de forma clara y concisa."

router: { model: mistral_nemo, profile: default }
default_domain: general

orchestration:
  planner: { model: deepseek_reason, profile: default }
  combiner: { model: mistral_nemo, profile: default }
  max_subtasks: 6
  max_iterations: 2
  max_replans: 1
  max_time_s: 120
  max_parallel: 2
  token_budget: { base: 2000, per_subtask: 3000 }
  default_effort: medium
  effort:
    low:
      max_subtasks: 3
      max_iterations: 1
      max_replans: 0
      max_time_s: 30
      coverage: { max_chunks: 4, max_retries_per_unit: 1 }
    high:
      max_subtasks: 12
      max_iterations: 4
      max_replans: 2
      max_time_s: 480
      coverage: { max_chunks: 16, max_retries_per_unit: 3 }
  coverage:
    validator: { model: qwen_tech, profile: default }
    units_per_chunk: 3
    max_chunks: 8
    max_retries_per_unit: 2
    max_no_progress_iterations: 2

identity_defaults:
  user_id: local
  service: local_cli

telemetry:
  csv_path: local/telemetry/core.csv
  jsonl_path: local/telemetry/core.jsonl
  rotation: size
  strict_mode: false
