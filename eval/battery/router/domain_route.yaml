# Casos de domain.route de la bateria del router semantico (ADR 0043),
# integrados en la fase 3a. El modelo router recibe el prompt y el catalogo de
# dominios (id + description) y devuelve JSON con domain, confidence, reason y
# alternatives opcional. world.script.router_responses alimenta el fake.

- id: router_domain_route_semantic_pick
  track: conformance
  description: "ADR 0043: domain.route devuelve el dominio, confianza y motivo del clasificador."
  capability: domain.route
  fixture: eval/fixtures/router.yaml
  input:
    prompt: "escribe una funcion en python que ordene una lista"
  world:
    script:
      router_responses:
        - '{"domain": "codigo", "confidence": 0.91, "reason": "pide escribir codigo"}'
  expect:
    domain: codigo
    model: fake_code
    confidence: 0.91

- id: router_domain_route_invalid_falls_back_to_default
  track: conformance
  description: "ADR 0043: si el router propone un dominio inexistente, cae al default con confianza 0."
  capability: domain.route
  fixture: eval/fixtures/router.yaml
  input:
    prompt: "algo que el modelo clasifica mal"
  world:
    script:
      router_responses:
        - '{"domain": "inventado", "confidence": 0.8, "reason": "dominio que no existe"}'
  expect:
    domain: general
    model: fake_general
    confidence: 0.0

- id: router_domain_route_by_meaning_not_keyword
  track: conformance
  description: "ADR 0043: un texto con la palabra 'logica' se enruta por sentido, no por keyword."
  capability: domain.route
  fixture: eval/fixtures/router.yaml
  input:
    prompt: "un mar de logica y magia: interpreta este texto poetico"
  world:
    script:
      router_responses:
        - '{"domain": "humanidades", "confidence": 0.82, "reason": "interpretacion de un texto"}'
  expect:
    domain: humanidades
    model: fake_general
    confidence: 0.82

- id: router_respects_model_per_domain
  track: conformance
  description: "ADR 0043: el modelo que sirve un dominio es el declarado en config; el core no opina."
  capability: domain.route
  fixture: eval/fixtures/router.yaml
  input:
    prompt: "administra un servicio systemd"
  world:
    script:
      router_responses:
        - '{"domain": "linux", "confidence": 0.88, "reason": "administracion de sistemas"}'
  expect:
    domain: linux
    model: fake_tech

- id: router_domain_route_tags_do_not_route
  track: conformance
  description: "ADR 0043 fase 3b-ii: los tags no fuerzan dominio; decide el clasificador semantico."
  capability: domain.route
  fixture: eval/fixtures/router.yaml
  input:
    prompt: "interpreta este poema"
    tags: [codigo]
  world:
    script:
      router_responses:
        - '{"domain": "humanidades", "confidence": 0.87, "reason": "interpretacion literaria"}'
  expect:
    domain: humanidades
    model: fake_general
    confidence: 0.87

# ---------------------------------------------------------------------------
# prompt.run: va DIRECTO, no invoca el router
# ---------------------------------------------------------------------------

- id: router_prompt_run_undeclared_uses_default_no_router
  track: conformance
  description: "ADR 0043: prompt.run sin declarar nada resuelve al default SIN llamar al router."
  capability: prompt.run
  fixture: eval/fixtures/router.yaml
  input:
    prompt: "hola"
  world:
    script:
      router_responses: []
  expect:
    domain: general
    model: fake_general
    router_invoked: false

- id: router_prompt_run_declared_domain_no_router
  track: conformance
  description: "ADR 0043/0019: prompt.run con --domain usa ese dominio, sin router."
  capability: prompt.run
  fixture: eval/fixtures/router.yaml
  input:
    prompt: "cualquier cosa"
    domain: codigo
  world:
    script:
      router_responses: []
  expect:
    domain: codigo
    model: fake_code
    router_invoked: false

- id: router_prompt_run_declared_model_no_router
  track: conformance
  description: "ADR 0019: prompt.run con --model usa ese modelo, sin router ni dominio."
  capability: prompt.run
  fixture: eval/fixtures/router.yaml
  input:
    prompt: "cualquier cosa"
    model: fake_reason
  world:
    script:
      router_responses: []
  expect:
    model: fake_reason
    router_invoked: false

# ---------------------------------------------------------------------------
# task.run: cada subtarea se enruta por el MISMO router
# ---------------------------------------------------------------------------

- id: router_task_subtasks_routed_by_router
  track: conformance
  description: "ADR 0043: en task.run, las subtareas sin dominio en el plan se enrutan por el router unico."
  capability: task.run
  fixture: eval/fixtures/router.yaml
  input:
    prompt: "resuelve un problema con dos partes"
    mode: pipeline
  world:
    script:
      plans:
        - - { prompt: "escribe la funcion" }
          - { prompt: "razona el enfoque" }
      router_responses:
        - '{"domain": "codigo", "confidence": 0.9, "reason": "codigo"}'
        - '{"domain": "razonamiento", "confidence": 0.85, "reason": "deduccion"}'
      responses:
        fake_code: "FUNCION"
        fake_reason: "ENFOQUE"
        fake_combiner: "COMBINADO"
      evaluate_decisions: [done]
  expect:
    stop_reason: task_done
    subtasks:
      - { domain: codigo, model: fake_code }
      - { domain: razonamiento, model: fake_reason }

- id: router_task_subtask_domain_hint_is_advisory
  track: conformance
  description: "ADR 0043 fase 3b-ii: domain_hint llega como contexto asesor y el router conserva la decision."
  capability: task.run
  fixture: eval/fixtures/router.yaml
  input:
    prompt: "tarea con pista asesora"
    mode: pipeline
  world:
    script:
      plans:
        - - { prompt: "razona esta parte", domain_hint: "Filosofia" }
      router_responses:
        - '{"domain": "razonamiento", "confidence": 0.84, "reason": "la subtarea pide deduccion"}'
      responses:
        fake_reason: "R"
        fake_combiner: "C"
      evaluate_decisions: [done]
  expect:
    stop_reason: task_done
    subtasks:
      - { domain: razonamiento, model: fake_reason }

- id: router_task_subtask_declared_domain_bypasses_router
  track: conformance
  description: "ADR 0043/0019: una subtarea con dominio fijado en el plan no invoca el router."
  capability: task.run
  fixture: eval/fixtures/router.yaml
  input:
    prompt: "una sola parte, con dominio fijado"
    mode: pipeline
  world:
    script:
      plans:
        - - { prompt: "escribe la funcion", domain: codigo }
      router_responses: []
      responses:
        fake_code: "FUNCION"
        fake_combiner: "COMBINADO"
      evaluate_decisions: [done]
  expect:
    stop_reason: task_done
    subtasks:
      - { domain: codigo, model: fake_code }
