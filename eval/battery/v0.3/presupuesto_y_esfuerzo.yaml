  capability: task.run
  fixture: eval/fixtures/orchestration_effort.yaml
  input:
    prompt: "dos puntos"
    mode: coverage
    effort: high
    identity: { user_id: u1, service: local_cli }
  world:
    script:
      derivations:
        - requirements: [{ id: r1, text: "cubrir los dos puntos" }]
          units:
