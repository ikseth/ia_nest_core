# Bateria congelada del plan explicito (linea v0.4-B2, core ADR 0040,
# 0047 y 0048). La fase v0.4-B3 implementa la capacidad y su ejecutor de
# evaluacion, y entonces integra estos casos quitando el sufijo .frozen.
#
# Fixture: eval/fixtures/orchestration_effort.yaml. Sus numeros redondos fijan
# semantica, no calibracion: token_budget base 1000 y per_subtask 500; medium
# admite 6 subtareas, low 3 y high 12.
#
# Scripting del planificador fake:
# - `derivations` conserva la forma interna vigente. El planificador devuelve
#   requirements con {id, text} y subtareas con `covers`.
# - El core invierte esa relacion al publicar: requirements usa
#   {id, statement, covered_by} y plan[] NO contiene `covers`.
# - `responses` y `evaluate_decisions` conservan su sentido vigente.
#
# Semantica congelada:
# - task.plan devuelve plan, requirements y effort como campos hermanos;
#   params y trace son informativos.
# - task.run recibe plan, requirements y effort como campos hermanos.
# - La forma publica de plan y plan_ready es unica, venga el plan del
#   planificador o suministrado por el consumidor.
# - Los asserts de llamadas a modelos se declaran como pytest requeridos en
#   eval/README.md: el DSL vigente no observa contadores de adaptador.

- id: plan_explicit_task_plan_returns_executable_shape
  track: conformance
  description: "Core ADR 0048: task.plan devuelve la peticion ejecutable, con dominios resueltos y sin covers publico."
  capability: task.plan
  fixture: eval/fixtures/orchestration_effort.yaml
  input:
    prompt: "analiza y explica"
    identity: { user_id: u1, service: local_cli }
  world:
    script:
      derivations:
        - requirements:
            - { id: r1, text: "analizar" }
            - { id: r2, text: "explicar" }
          subtasks:
            - { prompt: "analiza", domain: razonamiento, covers: [r1] }
            - { prompt: "explica", domain: general, depends_on: [0], covers: [r2] }
  expect:
    plan:
      - { index: 0, prompt: "analiza", domain: razonamiento, depends_on: [] }
      - { index: 1, prompt: "explica", domain: general, depends_on: [0] }
    requirements:
      - { id: r1, statement: "analizar", covered_by: [0] }
      - { id: r2, statement: "explicar", covered_by: [1] }
    effort: medium
    params:
      effort: medium
      max_subtasks: 6
    trace_fields: { capability: task.plan }

- id: plan_explicit_task_plan_honors_effort
  track: conformance
  description: "Core ADR 0045: task.plan refleja effort explicito y sus limites efectivos."
  capability: task.plan
  fixture: eval/fixtures/orchestration_effort.yaml
  input:
    prompt: "analiza una cosa"
    effort: low
    identity: { user_id: u1, service: local_cli }
  world:
    script:
      derivations:
        - requirements: [{ id: r1, text: "analizar" }]
          subtasks:
            - { prompt: "analiza", domain: razonamiento, covers: [r1] }
  expect:
    effort: low
    params:
      effort: low
      max_subtasks: 3
      max_iterations: 1
      max_replans: 0
      max_time_s: 30

- id: plan_explicit_supplied_plan_executes_directly
  track: conformance
  description: "Core ADR 0040: un plan valido entra directo en fan-out y plan_ready declara supplied."
  capability: task.run
  fixture: eval/fixtures/orchestration_effort.yaml
  input:
    prompt: "analiza una cosa"
    plan:
      - { index: 0, prompt: "analiza enriquecido", domain: razonamiento, depends_on: [] }
    requirements:
      - { id: r1, statement: "analizar", covered_by: [0] }
    effort: medium
    identity: { user_id: u1, service: local_cli }
  world:
    script:
      responses:
        fake_reason: "ANALISIS"
        fake_combiner: "COMBINADO_FINAL"
      evaluate_decisions: [done]
  expect:
    stop_reason: task_done
    response: "COMBINADO_FINAL"
    plan_source: supplied
    checkpoint_counts: { plan_ready: 1, subtask_done: 1 }

