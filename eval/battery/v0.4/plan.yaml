- id: plan_explicit_without_plan_preserves_current_output
  track: conformance
  description: "Core ADR 0040: sin plan de entrada se usa planner y la salida final actual no cambia."
  capability: task.run
  fixture: eval/fixtures/orchestration_effort.yaml
  input:
    prompt: "analiza y explica"
    effort: medium
    identity: { user_id: u1, service: local_cli }
  world:
    script:
      derivations:
        - requirements: [{ id: r1, text: "analizar y explicar" }]
          subtasks:
            - { prompt: "analiza", domain: razonamiento, covers: [r1] }
            - { prompt: "explica", domain: general, covers: [r1] }
      responses:
        fake_reason: "ANALISIS"
        fake_general: "EXPLICACION"
        fake_combiner: "COMBINADO_FINAL"
      evaluate_decisions: [done]
  expect:
    stop_reason: task_done
    response: "COMBINADO_FINAL"
    plan_source: planner
    plan_attempts: 1
    evaluation_attempts: 1
    requirements_covered: true
    uncovered_requirements: []
    degradations: []
    checkpoint_counts: { plan_ready: 1, subtask_done: 2, combine_ready: 1 }
    subtasks:
      - { iteration: 1, index: 0, domain: razonamiento, model: fake_reason }
      - { iteration: 1, index: 1, domain: general, model: fake_general }

