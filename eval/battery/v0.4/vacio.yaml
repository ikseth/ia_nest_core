# Bateria de la senal de vacio y del fin de flujo incompleto.
# ADR 0051 y ficha v0.4/0010.
#
# `responses.<model>` admite una cadena o una lista por llamada. La ultima
# respuesta se repite. `finish_reasons.<model>` guioniza el motivo de corte
# por llamada; si falta, el fake conserva `stop`.

- id: vacio_una_subtarea_se_excluye
  track: conformance
  description: "Core ADR 0051 R1-R2: una subtarea vacia se declara y se excluye del combinado."
  capability: task.run
  fixture: eval/fixtures/orchestration_effort.yaml
  input:
    prompt: "analiza y explica"
    plan:
      - { index: 0, prompt: "analiza", domain: razonamiento, depends_on: [] }
      - { index: 1, prompt: "explica", domain: general, depends_on: [] }
    requirements:
      - { id: r1, statement: "analizar y explicar", covered_by: [0, 1] }
    identity: { user_id: u1, service: local_cli }
  world:
    script:
      responses:
        fake_reason: ""
        fake_general: "CONTENIDO_UTIL"
        fake_combiner: "COMBINADO_SIN_VACIO"
      evaluate_decisions: [done]
  expect:
    stop_reason: task_done
    response: "COMBINADO_SIN_VACIO"
    degradations:
      - { stage: fanout, reason: empty_subtask_output, action: excluded_from_combine, subtask: "0" }

