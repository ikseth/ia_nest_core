# Fixture para la sonda de GPU del backend (ADR 0049).
# Dos modelos ollama que comparten UN endpoint: la sonda debe agruparlos en una
# sola entrada de backend.gpu. El endpoint no existe: la sonda va guionizada
# desde el caso, no toca red.

models:
  - id: ollama_a
    provider: ollama
    adapter: openai_compatible
    endpoint: http://backend-uno:11434/v1
    model_name: fake-a
    capabilities: [chat]
    profile: default
  - id: ollama_b
    provider: ollama
    adapter: openai_compatible
    endpoint: http://backend-uno:11434/v1
    model_name: fake-b
    capabilities: [chat]
    profile: default

domains:
  - id: general
    description: "Dominio general por defecto (fixture)"
    preferred_model: ollama_a
    fallback_models: [ollama_b]
    profile: default
    status: active

default_domain: general

profiles:
  - id: default
    temperature: 0.2
    max_tokens: 512
    top_p: 1.0
    max_iterations: 4
    max_time_s: 30
    max_context_tokens: 4096

identity_defaults:
  user_id: local
  service: local_cli

telemetry:
  csv_path: local/telemetry/eval.csv
  jsonl_path: local/telemetry/eval.jsonl
  rotation: size
  strict_mode: false
