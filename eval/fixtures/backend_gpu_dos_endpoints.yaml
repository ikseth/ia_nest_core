# Fixture para la sonda de GPU con DOS backends distintos (ADR 0049).
# `ollama_uno` y `ollama_dos` viven en endpoints diferentes, asi que backend.gpu
# debe devolver DOS entradas, cada una con sus propios modelos y su propio
# estado. Ninguno de los dos endpoints existe: la sonda va guionizada.

models:
  - id: ollama_dos
    provider: ollama
    adapter: openai_compatible
    endpoint: http://backend-dos:11434/v1
    model_name: fake-dos
    capabilities: [chat]
    profile: default
  - id: ollama_uno
    provider: ollama
    adapter: openai_compatible
    endpoint: http://backend-uno:11434/v1
    model_name: fake-uno
    capabilities: [chat]
    profile: default

domains:
  - id: general
    description: "Dominio general por defecto (fixture)"
    preferred_model: ollama_uno
    fallback_models: [ollama_dos]
    profile: default
    status: active

default_domain: general

profiles:
  - id: default
    temperature: 0.2
    max_tokens: 512
    top_p: 1.0
    max_iterations: 4
    max_time_s: 30
    max_context_tokens: 4096

identity_defaults:
  user_id: local
  service: local_cli

telemetry:
  csv_path: local/telemetry/eval.csv
  jsonl_path: local/telemetry/eval.jsonl
  rotation: size
  strict_mode: false
