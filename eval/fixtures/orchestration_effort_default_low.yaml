# Variante del fixture de esfuerzo con default_effort: low (ADR 0045 D5).
# Sirve a un solo caso: que el operador pueda declarar el nivel por defecto.
# Clona el fixture de orquestacion y le anade lo que esas dos decisiones
# introducen: token_budget, effort y default_effort. Las claves nuevas son
# INERTES hasta que el esquema las aprenda -el validador no rechaza claves
# desconocidas-, que es lo que permite congelar la bateria antes de implementar.
#
# Los numeros son PEQUENOS y REDONDOS a proposito: esta bateria fija SEMANTICA,
# no calibracion. Los valores que se publiquen en esquema, cargador y plantillas
# salen de la puerta de laboratorio (ADR 0044 D5 y ADR 0045 D7), y son otra cosa.


models:
  - id: fake_planner
    provider: fake
    adapter: openai_compatible
    endpoint: fake://planner
    model_name: fake-planner
    capabilities: [chat]
    profile: default
  - id: fake_combiner
    provider: fake
    adapter: openai_compatible
    endpoint: fake://combiner
    model_name: fake-combiner
    capabilities: [chat]
    profile: default
  - id: fake_code
    provider: fake
    adapter: openai_compatible
    endpoint: fake://code
    model_name: fake-code
    capabilities: [chat]
    profile: default
  - id: fake_reason
    provider: fake
    adapter: openai_compatible
    endpoint: fake://reason
    model_name: fake-reason
    capabilities: [chat]
    profile: default
  - id: fake_validator
    provider: fake
    adapter: openai_compatible
    endpoint: fake://validator
    model_name: fake-validator
    capabilities: [chat]
    profile: default
  - id: fake_general
    provider: fake
    adapter: openai_compatible
    endpoint: fake://general
    model_name: fake-general
    capabilities: [chat]
    profile: default

domains:
  - id: codigo
    description: "Programacion (fixture)"
    preferred_model: fake_code
    fallback_models: [fake_general]
    profile: default
    routing_rules:
      keywords: [codigo, funcion, script]
    status: active
  - id: razonamiento
    description: "Razonamiento paso a paso (fixture)"
    preferred_model: fake_reason
    fallback_models: []
    profile: default
    routing_rules:
      keywords: [razona, deduce]
    status: active
  - id: general
    description: "Dominio general por defecto (fixture)"
    preferred_model: fake_general
    fallback_models: []
    profile: default
    routing_rules:
      keywords: []
    status: active

profiles:
  - id: default
    temperature: 0.2
    max_tokens: 512
    top_p: 1.0
    max_iterations: 4
    max_time_s: 30
    max_context_tokens: 4096

orchestration:
  planner:
    model: fake_planner
    profile: default
  combiner:
    model: fake_combiner
    profile: default
  # El bloque base ES el nivel medium (ADR 0045 D3).
  max_subtasks: 6
  max_iterations: 2
  max_replans: 1
  max_time_s: 120
  max_parallel: 2
  token_budget:
    base: 1000
    per_subtask: 500
  default_effort: low
  effort:
    low:
      max_subtasks: 3
      max_iterations: 1
      max_replans: 0
      max_time_s: 30
      coverage: { max_chunks: 4, max_retries_per_unit: 1 }
    high:
      max_subtasks: 12
      max_iterations: 4
      max_replans: 2
      max_time_s: 480
      coverage: { max_chunks: 16, max_retries_per_unit: 3 }
  coverage:
    validator:
      model: fake_validator
      profile: default
    units_per_chunk: 3
    max_chunks: 8
    max_retries_per_unit: 2
    max_no_progress_iterations: 2

identity_defaults:
  user_id: local
  service: local_cli

telemetry:
  csv_path: local/telemetry/eval.csv
  jsonl_path: local/telemetry/eval.jsonl
  rotation: size
  strict_mode: false
